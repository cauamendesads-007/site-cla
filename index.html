const fs=t=>{const x=slots(t,0,30).find(y=>!y[1]);return x?`<p class="ok">Hoje, ${x[0]}</p>`:''};
const qin=t=>`<i class="d d${Math.min(t.queue.length,3)}"></i>${t.queue.length?`${t.queue.length} na fila · ~${wait(t)} min`:'Sem fila agora'}`;
const card=t=>`<a class="card" href="#/b/${t.slug}"><div class="th" style="background:linear-gradient(135deg,${t.theme.color},color-mix(in srgb,${t.theme.color} 30%,#000))"><span class="ni">${NL[t.niche]}</span><b>${esc(ini(t.name))}</b><span class="qb" data-q="${t.id}">${qin(t)}</span></div><div class="meta"><div class="av" style="background:${t.theme.color};color:${on(t.theme.color)}">${esc(ini(t.name)[0])}</div><div><h3>${esc(t.name)}</h3><p class="mu">${t.rating?'★ '+t.rating.toFixed(1):'Novo'} · ${esc(t.city)}${F.loc?' · '+km(t).toFixed(1).replace('.',',')+' km':''}</p><p class="mu">a partir de ${R(minP(t))}</p>${fs(t)}</div></div></a>`;
function list(){const r=S.tenants.filter(t=>ap(t)&&(F.niche=='all'||t.niche==F.niche)&&minP(t)<=F.max&&(t.rating||0)>=F.min&&(!F.cut||t.services.some(s=>s.tag==F.cut))&&(t.name+t.city+t.services.map(v=>v.name+v.tag).join(" ")).toLowerCase().includes(F.q.toLowerCase())&&(!F.top||t.rating>=4.8)&&(!F.today||slots(t,0,30).some(x=>!x[1])));
 const d=t=>F.loc?km(t):1e9;
 return r.sort({rate:(a,b)=>b.rating-a.rating,dist:(a,b)=>d(a)-d(b),queue:(a,b)=>wait(a)-wait(b),price:(a,b)=>minP(a)-minP(b)}[F.sort])}
function drawGrid(){const g=$('#grid');if(!g)return;const r=list();$('#cnt').textContent=r.length+(r.length==1?' resultado':' resultados');
 g.innerHTML=r.length?r.map(card).join(''):`<div class="empty"><p>Nenhum resultado com esses filtros.</p><button class="btn" data-a="clear">Limpar filtros</button></div>`}

 const N=[['all','Todos'],['barbearia','Barbearias'],['feminino','♀ Salões femininos'],['visagismo','Visagismo'],['infantil','Infantil']];

<div class="days">${[0,1,2,3,4,5,6].map(d=>`<button class="slot ${B.day==d?'on':''}" data-a="day" data-v="${d}">${new Date(Date.now()+d*864e5).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit'})}</button>`).join('')}</div>
